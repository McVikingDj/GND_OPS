<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OSM AA Ground OPS Watchlist</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="mark">OSM</div>
        <div>
          <div class="eyebrow">OSM Aviation Academy</div>
          <h1>Ground OPS Watchlist</h1>
        </div>
      </div>

      <div class="summary">
        <span id="summaryLine">Attention 0 · Active 0 · Away 0</span>
      </div>

      <div class="clocks">
        <div><span>Local</span><b id="clockLocal">--:--:--</b></div>
        <div><span>UTC</span><b id="clockUtc">--:--:--</b></div>
      </div>
    </header>

    <main class="watchlist">
      <section class="panel attentionPanel">
        <header>
          <div>
            <span>Needs operator awareness</span>
            <h2>Attention</h2>
          </div>
          <b id="attentionCount">0</b>
        </header>
        <div class="aircraftList" id="attentionList"></div>
      </section>

      <section class="panel activePanel">
        <header>
          <div>
            <span>Normal local picture</span>
            <h2>Active</h2>
          </div>
          <b id="activeCount">0</b>
        </header>
        <div class="aircraftList" id="activeList"></div>
      </section>

      <section class="panel awayPanel">
        <button id="toggleAwayBtn" type="button">
          <span>Away / changed frequency</span>
          <b><span id="metricAway">0</span> aircraft</b>
        </button>
        <div class="aircraftList awayList collapsed" id="listAway"></div>
      </section>
    </main>

    <footer class="controlBar">
      <button id="addAircraftBtn" class="primary" type="button">Add Aircraft</button>

      <div class="selectedBlock" id="selectedCard">
        <strong>No aircraft selected</strong>
        <span>Tap a row to update it</span>
      </div>

      <div class="quickActions">
        <button data-action-position="ground" disabled>Ground</button>
        <button data-action-position="movement" disabled>Taxi</button>
        <button data-action-position="pattern" disabled>Pattern</button>
        <button data-action-position="local" disabled>Local</button>
        <button data-action-position="inbound" disabled>Inbound</button>
        <button data-action-position="outbound" disabled>Out</button>
        <button data-action-position="away" disabled>Away</button>
        <button id="editAircraftBtn" type="button" disabled>Note/Edit</button>
        <button id="closeAircraftBtn" type="button" class="danger" disabled>Close</button>
        <button id="clearSelectionBtn" type="button" disabled>Clear</button>
      </div>

      <div class="utilityMenu">
        <button id="demoBtn" type="button">Demo</button>
        <button id="exportBtn" type="button">Export</button>
        <label class="importButton">Import<input id="importFile" type="file" accept="application/json" /></label>
        <button id="clearAllBtn" class="danger ghostDanger" type="button">Clear</button>
      </div>
    </footer>
  </div>

  <div class="modalBackdrop hidden" id="aircraftModal" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <header>
        <div>
          <span>Aircraft</span>
          <h2 id="modalTitle">Add aircraft</h2>
        </div>
        <button id="closeModalBtn" type="button" aria-label="Close">×</button>
      </header>

      <form id="aircraftForm">
        <input type="hidden" id="aircraftId" />

        <section class="formSection">
          <h3>Identity</h3>
          <div class="formGrid">
            <label class="wide">Callsign<input id="callsign" autocomplete="off" placeholder="SCQ123 / LN-ABC" required /></label>
            <label>Registration<input id="registration" autocomplete="off" placeholder="LN-AZA" /></label>
            <label>Type<input id="aircraftType" autocomplete="off" placeholder="C172" /></label>
          </div>
        </section>

        <section class="formSection">
          <h3>Current picture</h3>
          <div class="formGrid">
            <label>Position
              <select id="position">
                <option value="ground">Ground</option>
                <option value="movement">Taxi / runway</option>
                <option value="pattern">Pattern</option>
                <option value="local">Local area</option>
                <option value="inbound">Inbound</option>
                <option value="outbound">Outbound</option>
                <option value="away">Away</option>
              </select>
            </label>
            <label>Intention
              <select id="intention">
                <option value="Departure">Departure</option>
                <option value="Arrival">Arrival</option>
                <option value="TGL">TGL</option>
                <option value="Local training">Local training</option>
                <option value="Fuel">Fuel</option>
                <option value="Parking">Parking</option>
                <option value="Unknown">Unknown</option>
              </select>
            </label>
            <label>Operator
              <select id="operatorType">
                <option value="OSM">OSM</option>
                <option value="Visitor">Visitor</option>
              </select>
            </label>
          </div>
        </section>

        <section class="formSection">
          <h3>Flags</h3>
          <div class="toggleRow">
            <label><input id="flagSolo" type="checkbox" /> Solo</label>
            <label><input id="flagInstructor" type="checkbox" /> Instructor</label>
            <label><input id="flagFuel" type="checkbox" /> Fuel expected</label>
          </div>
        </section>

        <section class="formSection">
          <h3>OPS note</h3>
          <label class="noteLabel"><textarea id="note" placeholder="Short note for the current operator"></textarea></label>
        </section>

        <div class="formActions">
          <button id="deleteFromModalBtn" type="button" class="danger" hidden>Close aircraft</button>
          <div class="spacer"></div>
          <button id="cancelModalBtn" type="button">Cancel</button>
          <button class="primary" type="submit">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
